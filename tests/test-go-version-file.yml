name: Test go-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run govulncheck using go-version-file
        id: action
        uses: .
        with:
          go-version-file: '${{ github.workspace }}/tests/fixtures/basic-go/go.mod'
          repo-checkout: 'false'
          work-dir: '${{ github.workspace }}/tests/fixtures/basic-go'
          go-package: './...'
          output-format: 'text'
      - name: Assert govulncheck ran successfully using go-version-file
        run: |
          echo "PASS: govulncheck completed using go-version-file without error"
