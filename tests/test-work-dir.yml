name: Test work-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run govulncheck in a subdirectory
        id: action
        uses: .
        with:
          go-version-input: 'stable'
          repo-checkout: 'false'
          work-dir: '${{ github.workspace }}/tests/fixtures/subdir-go/subpkg'
          go-package: './...'
          output-format: 'text'
      - name: Assert govulncheck ran successfully in subdirectory
        run: |
          echo "PASS: govulncheck completed in subdirectory without error"
