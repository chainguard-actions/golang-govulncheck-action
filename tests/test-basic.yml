name: Test basic govulncheck usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version-input: 'stable'
          repo-checkout: 'false'
          work-dir: '${{ github.workspace }}/tests/fixtures/gomod'
          go-package: './...'
          output-format: 'text'
      - name: Assert govulncheck ran successfully
        run: |
          echo "PASS: govulncheck completed without error"
