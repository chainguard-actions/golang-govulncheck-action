name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run govulncheck with JSON output format saved to file
        id: action
        uses: .
        with:
          go-version-input: 'stable'
          repo-checkout: 'false'
          work-dir: '${{ github.workspace }}/tests/fixtures/basic-go'
          go-package: './...'
          output-format: 'json'
          output-file: '/tmp/govulncheck-json-output.txt'
      - name: Assert JSON output file was created and contains valid JSON
        run: |
          echo "Checking JSON output file exists..."
          if [ ! -f /tmp/govulncheck-json-output.txt ]; then
            echo "FAIL: output file /tmp/govulncheck-json-output.txt was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/govulncheck-json-output.txt
          echo ""
          echo "Checking output contains JSON structure..."
          if ! grep -q '{' /tmp/govulncheck-json-output.txt; then
            echo "FAIL: output does not appear to contain JSON"
            exit 1
          fi
          echo "PASS: JSON output file was created with JSON content"
